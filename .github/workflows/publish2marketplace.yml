name: Publish to Visual Studio Marketplace
run-name: "${{ inputs.auth_only && 'OIDC preflight' || 'Publish' }} ${{ inputs.version }} @ ${{ inputs.commit }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish (no automatic version bump)
        required: true
        default: '0.2.1'
        type: string
      commit:
        description: Full 40-character main commit SHA reviewed for this release
        required: true
        type: string
      auth_only:
        description: Verify OIDC trust only; never upload the extension in this run
        required: true
        default: false
        type: boolean
      confirm_publish:
        description: Approve this version and commit (auth_only still prevents publication)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package the selected commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.guard.outputs.package_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
      PACKAGE_PATH: artifacts/lab530.chatgpt-subscription-for-copilot-${{ inputs.version }}.vsix
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Guard release identity, version, branch, and approval
        id: guard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REPOSITORY, '0x3st/chatgpt-subscription-for-copilot');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.CONFIRM_PUBLISH, 'true', 'Explicit publication confirmation is required');
          assert.match(process.env.EXPECTED_COMMIT || '', /^[0-9a-f]{40}$/);
          assert.equal(process.env.GITHUB_SHA, process.env.EXPECTED_COMMIT, 'The selected main commit has changed');
          assert.match(process.env.EXPECTED_VERSION || '', /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(manifest.version, process.env.EXPECTED_VERSION);
          assert.equal(manifest.publisher, 'lab530');
          assert.equal(manifest.name, 'chatgpt-subscription-for-copilot');
          assert.equal(manifest.repository.url, 'https://github.com/0x3st/chatgpt-subscription-for-copilot.git');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_name=lab530.chatgpt-subscription-for-copilot-${manifest.version}.vsix\n`);
          NODE
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run check
      - name: Run offline protocol and integration tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Build VSIX without publishing
        run: npm run package
      - name: Verify exact archive and tested runtime; record SHA-256
        id: package
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, zipfile
          import xml.etree.ElementTree as ET
          path = pathlib.Path(os.environ['PACKAGE_PATH'])
          expected = {
              'extension.vsixmanifest', '[Content_Types].xml',
              'extension/LICENSE.txt', 'extension/PRIVACY.md',
              'extension/THIRD_PARTY_NOTICES.md', 'extension/package.json',
              'extension/readme.md', 'extension/assets/brand/icon.png',
              'extension/dist/extension.cjs',
          }
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert len(names) == len(expected) and set(names) == expected, 'Unexpected archive contents'
              manifest = json.loads(archive.read('extension/package.json'))
              assert manifest['publisher'] == 'lab530' and manifest['name'] == 'chatgpt-subscription-for-copilot'
              assert manifest['version'] == os.environ['EXPECTED_VERSION']
              assert manifest['icon'] == 'assets/brand/icon.png'
              xml = ET.fromstring(archive.read('extension.vsixmanifest'))
              ns = {'v': 'http://schemas.microsoft.com/developer/vsx-schema/2011'}
              identity = xml.find('v:Metadata/v:Identity', ns)
              assert identity is not None
              assert identity.attrib['Id'] == 'chatgpt-subscription-for-copilot' and identity.attrib['Publisher'] == 'lab530'
              assert identity.attrib['Version'] == os.environ['EXPECTED_VERSION']
              runtime = archive.read('extension/dist/extension.cjs')
              assert runtime == pathlib.Path('dist/extension.cjs').read_bytes()
              assert runtime == pathlib.Path('.test-build/extension-under-test.cjs').read_bytes(), 'Untested runtime'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha256={digest}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Version: `{manifest['version']}`\n\nCommit: `{os.environ['GITHUB_SHA']}`\n\nVSIX SHA-256: `{digest}`\n")
          PY
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: ${{ inputs.auth_only && 'Check Marketplace OIDC only (no publication)' || 'Publish the verified VSIX through Trusted Publishing' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=lab530.chatgpt-subscription-for-copilot
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_PATH: artifact/${{ needs.verify.outputs.package_name }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - name: Check out the same reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked official publisher without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Verify Marketplace trust without publishing or exposing credentials
        run: node scripts/marketplace-auth.cjs
      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ github.sha }}
          path: artifact
      - name: Recheck the exact package hash before publication
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          assert.match(process.env.EXPECTED_SHA256 || '', /^[0-9a-f]{64}$/);
          const actual = createHash('sha256').update(fs.readFileSync(process.env.PACKAGE_PATH)).digest('hex');
          assert.equal(actual, process.env.EXPECTED_SHA256, 'The downloaded package differs from the tested package');
          NODE
      # Project-specific, user-approved Marketplace Preview exception:
      # vsce 4.1.0 uses api-version=7.2-preview.1 for OIDC exchange and Gallery publishing.
      # No PAT, API-key billing fallback, version bump, Git tag, or GitHub release.
      - name: Publish to Marketplace using official OIDC
        if: ${{ !inputs.auth_only }}
        run: npx --no-install vsce publish --packagePath "$PACKAGE_PATH" --oidc
